<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .canvas-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #canvas {
            background: #0f1419;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
            width: 100%;
            height: 500px;
            display: block;
            border: 2px solid rgba(124, 58, 237, 0.3);
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: linear-gradient(45deg, #7c3aed, #00d4ff);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 44px;
            min-width: 44px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 100px;
            height: 6px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        input[type="file"] {
            display: none;
        }

        .file-input-label {
            background: linear-gradient(45deg, #00d4ff, #7c3aed);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            min-height: 44px;
            display: flex;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.4);
        }

        .file-input-label:active {
            transform: translateY(0);
        }

        .filename {
            flex: 1;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.85em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 1.1em;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-btn {
            padding: 12px;
            background: rgba(124, 58, 237, 0.2);
            border: 2px solid rgba(124, 58, 237, 0.4);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
            min-height: 44px;
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #7c3aed, #00d4ff);
            border-color: #00d4ff;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.3);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(124, 58, 237, 0.4);
            border-color: #00d4ff;
        }

        .info {
            font-size: 0.85em;
            color: #00d4ff;
            text-align: center;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            border-radius: 2px;
            width: 0%;
        }

        .time-display {
            font-size: 0.85em;
            color: #00d4ff;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            #canvas {
                height: 300px;
            }

            .controls {
                flex-direction: column;
            }

            input[type="range"] {
                width: 100%;
            }

            .sidebar {
                grid-column: 1;
            }

            button, .file-input-label {
                width: 100%;
                padding: 15px;
                font-size: 1em;
            }

            .mode-btn {
                width: 100%;
                padding: 15px;
                font-size: 1em;
            }

            .slider-group {
                width: 100%;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Audio Visualizer</h1>

        <div class="canvas-section">
            <canvas id="canvas"></canvas>

            <div class="controls">
                <label for="audioFile" class="file-input-label">Upload Audio</label>
                <input type="file" id="audioFile" accept="audio/*">
                <span class="filename" id="filename">No file selected</span>
            </div>

            <div class="controls" style="flex-direction: column; gap: 10px;">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button id="playBtn" disabled>▶ Play</button>
                    <button id="pauseBtn" disabled>⏸ Pause</button>
                </div>

                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>

                <div class="slider-group">
                    <label for="volume">Volume:</label>
                    <input type="range" id="volume" min="0" max="100" value="70">
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div>
                <h3>Visualization</h3>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="bars">📊 Frequency Bars</button>
                    <button class="mode-btn" data-mode="waveform">〰️ Waveform</button>
                </div>
            </div>

            <div class="info">
                Upload an audio file and press play to start visualizing!
            </div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        // Get elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio');
        const audioFile = document.getElementById('audioFile');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const volumeSlider = document.getElementById('volume');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const filenameEl = document.getElementById('filename');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // Audio context and analyser
        let audioContext;
        let analyser;
        let dataArray;
        let bufferLength;
        let animationId;
        let currentMode = 'bars';

        // Initialize canvas
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Format time
        function formatTime(seconds) {
            if (!isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Initialize audio context
        function initAudioContext() {
            if (audioContext) return;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            const source = audioContext.createMediaElementAudioSource(audio);
            const gainNode = audioContext.createGain();

            source.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioContext.destination);

            // Volume control
            gainNode.gain.value = volumeSlider.value / 100;
            volumeSlider.addEventListener('input', () => {
                gainNode.gain.value = volumeSlider.value / 100;
            });
        }

        // File upload
        audioFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initAudioContext();

            const url = URL.createObjectURL(file);
            audio.src = url;
            filenameEl.textContent = file.name;
            playBtn.disabled = false;
            pauseBtn.disabled = false;

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            }, { once: true });
        });

        // Play/Pause
        playBtn.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            audio.play();
            animate();
        });

        pauseBtn.addEventListener('click', () => {
            audio.pause();
        });

        // Progress bar
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        // Mode switching
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        // Visualization
        function drawFrequencyBars() {
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#0f1419';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = canvas.width / bufferLength * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;

                // Color gradient
                const hue = (i / bufferLength) * 60 + 200;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;

                ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        function drawWaveform() {
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#0f1419';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;
            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            // Draw multiple waveforms with different colors
            for (let waveNum = 0; waveNum < 3; waveNum++) {
                ctx.beginPath();
                ctx.lineWidth = 3 - waveNum * 0.5;

                const hue = 200 + waveNum * 60;
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.globalAlpha = 1 - waveNum * 0.3;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = centerY + (v - 1) * 50 * (1 + waveNum * 0.5);

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                ctx.stroke();
                x = 0;
            }

            ctx.globalAlpha = 1;
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            if (!analyser) return;

            if (currentMode === 'bars') {
                drawFrequencyBars();
            } else if (currentMode === 'waveform') {
                drawWaveform();
            }
        }

        // Stop animation when audio ends
        audio.addEventListener('ended', () => {
            cancelAnimationFrame(animationId);
        });

        // Initial canvas draw
        ctx.fillStyle = '#0f1419';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00d4ff';
        ctx.font = '18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Upload an audio file to start', canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
